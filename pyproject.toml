[project]
name = "modalfiles"
version = "0.2.0"
description = "Self-hosted, password-protected WebDAV file share backed by a Modal Volume."
readme = "README.md"
license = "MIT"
authors = [{ name = "ranleak" }]
requires-python = ">=3.10"
dependencies = [
    "modal>=1.1,<2",
    "fastapi==0.115.12",
    "a2wsgi==1.10.10",
    "WsgiDAV==4.3.3",
]

[project.scripts]
modalfiles-gui = "modalfiles.gui.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modalfiles"]
artifacts = ["modalfiles/gui/static/**"]
